<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ระบบอัญเชิญสัตว์เวทมนตร์ - งานเปิดตัวสัตว์เวทมนตร์ (Magical Creature Summoning System)">
    <title>MAGICAL CREATURE SUMMONING - ระบบอัญเชิญสัตว์เวทมนตร์</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Kanit:wght@300;400;600;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Animated Particles -->
    <canvas id="particleCanvas"></canvas>

    <!-- Ambient Magic Light Flares -->
    <div class="ambient-glow bg-glow-purple"></div>
    <div class="ambient-glow bg-glow-gold"></div>

    <!-- Main Container -->
    <main class="main-container" id="mainContainer">
        <!-- Header Title Section -->
        <header class="header">
            <div class="event-badge">
                <span class="star-icon">✦</span> MAGICAL CREATURE LAUNCH EVENT <span class="star-icon">✦</span>
            </div>
            <h1 class="main-title">MAGICAL CREATURE SUMMONING</h1>
            <p class="subtitle">กล่าวคำอัญเชิญเพื่อปลุกพลังเวทมนตร์</p>
        </header>

        <!-- Central Magic Circle Visualizer -->
        <div class="magic-circle-wrapper" id="magicCircleWrapper">
            <div class="magic-aura" id="magicAura"></div>
            <div class="lightning-overlay" id="lightningOverlay"></div>
            
            <!-- SVG Rotating Rune Circle -->
            <svg class="magic-circle-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
                <!-- Outer Rune Ring -->
                <g class="ring-outer" id="ringOuter">
                    <circle cx="250" cy="250" r="230" class="circle-line thin" />
                    <circle cx="250" cy="250" r="220" class="circle-line dashed" />
                    <circle cx="250" cy="250" r="210" class="circle-line gold" />
                    <!-- Runes text path -->
                    <path id="runePath" d="M 250,250 m -215,0 a 215,215 0 1,1 430,0 a 215,215 0 1,1 -430,0" fill="none" />
                    <text class="rune-text">
                        <textPath href="#runePath" startOffset="0%">
                            ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ ✦ ANCIENT MAGICAL ENERGY ✦ ᚷ ᚹ ᚺ ᚾ ᛁ ᛃ ✦ UNKNOWN CREATURE AWAKENING ✦ ᛇ ᛈ ᛉ ᛋ ᛏ
                        </textPath>
                    </text>
                </g>

                <!-- Middle Geometric Star (Octagram) -->
                <g class="ring-middle" id="ringMiddle">
                    <circle cx="250" cy="250" r="170" class="circle-line gold-thin" />
                    <polygon points="250,80 295,205 420,250 295,295 250,420 205,295 80,250 205,205" class="star-polygon" />
                    <polygon points="250,80 295,205 420,250 295,295 250,420 205,295 80,250 205,205" class="star-polygon rot-45" />
                    <circle cx="250" cy="250" r="120" class="circle-line inner-glow" />
                </g>

                <!-- Inner Core & Mystery Glyph -->
                <g class="ring-inner" id="ringInner">
                    <circle cx="250" cy="250" r="85" class="core-circle" />
                    <!-- Mysterious Rune Glyph -->
                    <path class="mystery-glyph" d="M250,180 L285,250 L250,320 L215,250 Z M250,210 L265,250 L250,290 L235,250 Z" />
                    <circle cx="250" cy="250" r="18" class="mystery-eye" />
                </g>
            </svg>

            <!-- Center Core Sphere Node -->
            <div class="core-node" id="coreNode">
                <div class="node-icon" id="nodeIcon">🔮</div>
            </div>
        </div>

        <!-- Suspense Status Panel -->
        <div class="status-panel" id="statusPanel">
            <div class="status-indicator">
                <span class="status-dot" id="statusDot"></span>
                <span class="status-badge-text" id="statusBadgeText">พร้อมใช้งาน</span>
            </div>
            
            <!-- Suspense Main Title (NEVER SHOWS ANIMAL NAME BEFORE VIDEO) -->
            <h2 class="status-title" id="statusTitle">ระบบอัญเชิญพร้อมใช้งาน</h2>
            <div class="status-english" id="statusEnglish">READY FOR SUMMONING COMMAND</div>
            
            <div class="transcript-box" id="transcriptBox">
                <span class="transcript-label">เสียงที่ได้ยิน:</span>
                <span class="transcript-text" id="transcriptText">"..."</span>
            </div>
            
            <div class="command-hint">
                <span class="hint-icon">🎙️</span> พูดว่า: <strong class="command-phrase">“มังกรจงออกมา”</strong>
            </div>
        </div>

        <!-- Controls Action Panel -->
        <div class="control-panel">
            <button id="startBtn" class="btn btn-primary">
                <span class="btn-icon">⚡</span>
                <span class="btn-text">เริ่มระบบเวทมนตร์</span>
            </button>

            <button id="fullscreenBtn" class="btn btn-secondary">
                <span class="btn-icon">🖥️</span>
                <span class="btn-text">เข้าสู่โหมดงานแสดง</span>
            </button>
        </div>

        <!-- Footer Note -->
        <footer class="footer-note">
            <span>กด <kbd>ESC</kbd> เพื่อหยุดวิดีโอฉุกเฉินและกลับสู่หน้ารอรับคำสั่ง</span>
        </footer>
    </main>

    <!-- White Flash Portal Overlay for Impact Climax -->
    <div class="flash-overlay" id="flashOverlay"></div>

    <!-- Fullscreen Video Element -->
    <video id="dragonVideo" preload="auto" playsinline>
        <source src="dragon.mp4" type="video/mp4">
        เบราว์เซอร์ของคุณไม่รองรับการเล่นวิดีโอ
    </video>

    <!-- JavaScript Module -->
    <script src="script.js"></script>
</body>
</html>
