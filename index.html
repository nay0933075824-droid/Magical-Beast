<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ระบบอัญเชิญมังกรเวทมนตร์ - งานเปิดตัวธีมสัตว์เวทมนตร์ (Magical Dragon Summoning System)">
    <title>MAGICAL DRAGON SUMMONING - ระบบอัญเชิญมังกรเวทมนตร์</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Kanit:wght@300;400;600;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Animated Particles -->
    <canvas id="particleCanvas"></canvas>

    <!-- Ambient Magic Light Flares -->
    <div class="ambient-glow bg-glow-purple"></div>
    <div class="ambient-glow bg-glow-gold"></div>

    <!-- Main Container -->
    <main class="main-container" id="mainContainer">
        <!-- Header Title Section -->
        <header class="header">
            <div class="event-badge">
                <span class="star-icon">✦</span> MAGICAL THEME LAUNCH EVENT <span class="star-icon">✦</span>
            </div>
            <h1 class="main-title">MAGICAL DRAGON SUMMONING</h1>
            <p class="subtitle">กล่าวคำอัญเชิญเพื่อปลุกมังกร</p>
        </header>

        <!-- Central Magic Circle Visualizer -->
        <div class="magic-circle-wrapper" id="magicCircleWrapper">
            <div class="magic-aura"></div>
            
            <!-- SVG Rotating Rune Circle -->
            <svg class="magic-circle-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
                <!-- Outer Rune Ring -->
                <g class="ring-outer">
                    <circle cx="250" cy="250" r="230" class="circle-line thin" />
                    <circle cx="250" cy="250" r="220" class="circle-line dashed" />
                    <circle cx="250" cy="250" r="210" class="circle-line gold" />
                    <!-- Runes text path -->
                    <path id="runePath" d="M 250,250 m -215,0 a 215,215 0 1,1 430,0 a 215,215 0 1,1 -430,0" fill="none" />
                    <text class="rune-text">
                        <textPath href="#runePath" startOffset="0%">
                            ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ ✦ DRAGONIS MAGICA ✦ ᚷ ᚹ ᚺ ᚾ ᛁ ᛃ ✦ SUMMON THE ANCIENT ONE ✦ ᛇ ᛈ ᛉ ᛋ ᛏ
                        </textPath>
                    </text>
                </g>

                <!-- Middle Geometric Star (Octagram) -->
                <g class="ring-middle">
                    <circle cx="250" cy="250" r="170" class="circle-line gold-thin" />
                    <polygon points="250,80 295,205 420,250 295,295 250,420 205,295 80,250 205,205" class="star-polygon" />
                    <polygon points="250,80 295,205 420,250 295,295 250,420 205,295 80,250 205,205" class="star-polygon rot-45" />
                    <circle cx="250" cy="250" r="120" class="circle-line inner-glow" />
                </g>

                <!-- Inner Core & Dragon Glyph -->
                <g class="ring-inner">
                    <circle cx="250" cy="250" r="85" class="core-circle" />
                    <!-- Dragon Emblem Path -->
                    <path class="dragon-glyph" d="M250,185 C260,205 280,215 295,200 C310,185 320,210 300,230 C280,250 290,270 270,285 C255,295 250,315 250,315 C250,315 245,295 230,285 C210,270 220,250 200,230 C180,210 190,185 205,200 C220,215 240,205 250,185 Z" />
                    <circle cx="250" cy="250" r="15" class="dragon-eye" />
                </g>
            </svg>

            <!-- Center Core Pulse Node -->
            <div class="core-node" id="coreNode">
                <div class="node-icon">🐉</div>
            </div>
        </div>

        <!-- Status & Voice Feedback Display -->
        <div class="status-panel">
            <div class="status-indicator">
                <span class="status-dot" id="statusDot"></span>
                <span class="status-badge-text" id="statusBadgeText">พร้อมใช้งาน</span>
            </div>
            
            <h2 class="status-text" id="statusText">ระบบเวทมนตร์พร้อมใช้งาน</h2>
            
            <div class="transcript-box" id="transcriptBox">
                <span class="transcript-label">เสียงที่ได้ยิน:</span>
                <span class="transcript-text" id="transcriptText">"..."</span>
            </div>
            
            <div class="command-hint">
                <span class="hint-icon">🎙️</span> พูดว่า: <strong class="command-phrase">“มังกรจงออกมา”</strong> หรือ <strong class="command-phrase">“มังกร จงออกมา”</strong>
            </div>
        </div>

        <!-- Controls Action Panel -->
        <div class="control-panel">
            <button id="startBtn" class="btn btn-primary">
                <span class="btn-icon">⚡</span>
                <span class="btn-text">เริ่มระบบเวทมนตร์</span>
            </button>

            <button id="fullscreenBtn" class="btn btn-secondary">
                <span class="btn-icon">🖥️</span>
                <span class="btn-text">เข้าสู่โหมดงานแสดง</span>
            </button>
        </div>

        <!-- Footer / Shortcut Note -->
        <footer class="footer-note">
            <span>กด <kbd>ESC</kbd> เพื่อหยุดวิดีโอฉุกเฉินและกลับสู่หน้ารอรับคำสั่ง</span>
        </footer>
    </main>

    <!-- Summoning Portal Magic Overlay (Screen Flash Effect) -->
    <div class="summon-portal-overlay" id="summonPortalOverlay">
        <div class="portal-ring"></div>
        <div class="portal-light"></div>
        <div class="portal-title" id="portalTitle">กำลังเปิดประตูเวทมนตร์...</div>
    </div>

    <!-- Fullscreen Video Element -->
    <video id="dragonVideo" preload="auto" playsinline>
        <source src="dragon.mp4" type="video/mp4">
        เบราว์เซอร์ของคุณไม่รองรับการเล่นวิดีโอ
    </video>

    <!-- JavaScript Module -->
    <script src="script.js"></script>
</body>
</html>
